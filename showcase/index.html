<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#070c13" />
  <title>ArcNode</title>
  <link rel="icon" href="assets/arcnode-logo.png" type="image/png" />
  <link rel="stylesheet" href="assets/app.css?v=15-hide-news-kicker" />
  <link rel="stylesheet" href="assets/news.css?v=12" />
  <script defer src="assets/news.js?v=12-hetzner-1"></script>
  <link rel="stylesheet" href="assets/cube.css?v=12" />
  <script defer src="assets/cube.js?v=12"></script>
  <script defer src="assets/app.js?v=14-tablet"></script>
  <style>
    /* Minimal landing page: brand and four clear, fully clickable previews. */
    #home-view { padding-top: 24px; }
    #home-view .card-information { padding: 12px 18px 14px; display: block; }
    #home-view .card-information small { display: block; font-size: 10px; }
    #home-view .card-information h2 { margin: 5px 0 0; font-size: 21px; line-height: 1.15; }
    @media (max-width: 600px) {
      #home-view { padding-top: 18px; }
      #home-view .card-information { padding: 10px 12px 12px; }
      #home-view .card-information small { font-size: 8px; }
      #home-view .card-information h2 { font-size: 17px; line-height: 1.2; }
    }
  </style>
</head>
<body>
  <div class="app-root">
    <header class="site-header">
      <button id="brand-home" class="brand-mark" type="button" aria-label="Ga naar ArcNode overzicht">
        <img src="assets/arcnode-logo.png" alt="Origineel ArcNode beeldmerk" width="50" height="50" />
        <span class="brand-wordmark">ARCNODE<span class="brand-period">.</span><small>FROM NOISE TO SIGNAL</small></span>
      </button>
    </header>
    <main>
      <section id="home-view" class="view" aria-label="ArcNode hoofdscherm">
        <div class="case-grid">
          <button type="button" class="case-card case-cube" data-case="cube">
            <div class="card-illustration cube-ill">
              <svg viewBox="0 0 600 245" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
                <defs><radialGradient id="cube-glow"><stop stop-color="#154964"/><stop offset="1" stop-color="#07111d"/></radialGradient></defs>
                <rect width="600" height="245" fill="url(#cube-glow)"/>
                <g transform="translate(0,-1)">
                  <polygon points="300,21 399,76 300,133 201,76" fill="#1b99b5" fill-opacity=".14" stroke="#4ad8e9" stroke-width="2"/>
                  <polygon points="201,76 300,133 300,232 201,175" fill="#14779e" fill-opacity=".12" stroke="#35b9d4" stroke-width="2"/>
                  <polygon points="399,76 300,133 300,232 399,175" fill="#24d0d7" fill-opacity=".12" stroke="#6af4ef" stroke-width="2"/>
                  <path d="M300 21V133M201 175L300 133 399 175M300 232V133" stroke="#9cfbfa" stroke-width="1.5" stroke-dasharray="5 7" opacity=".32" fill="none"/>
                  <path d="M251 103L335 103 358 148 293 171 251 103M293 171L325 193" fill="none" stroke="#53d9e3" stroke-opacity=".55" stroke-width="1.3"/>
                  <g fill="#79f4f6"><circle cx="251" cy="103" r="5"/><circle cx="335" cy="103" r="7"/><circle cx="358" cy="148" r="4"/><circle cx="293" cy="171" r="6"/><circle cx="325" cy="193" r="3"/></g>
                  <circle cx="300" cy="133" r="11" fill="#112e40" stroke="#abffff" stroke-width="2"/>
                </g>
              </svg>
              
            </div>
            <div class="card-information"><div><small>01 / KENNIS</small><h2>Knowledge Cube</h2></div></div>
          </button>
          <button type="button" class="case-card case-production" data-case="production">
            <div class="card-illustration production-ill">
              <svg viewBox="0 0 600 245" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
                <defs><linearGradient id="flow-path"><stop stop-color="#2e94b3"/><stop offset="1" stop-color="#74eee1"/></linearGradient></defs>
                <path d="M119 125H481" stroke="url(#flow-path)" stroke-width="3" stroke-dasharray="6 7" opacity=".76" />
                <g stroke="#4bb9cf" stroke-width="2" fill="#112f43">
                  <rect x="75" y="76" width="88" height="100" rx="11"/>
                  <rect x="196" y="76" width="88" height="100" rx="11"/>
                  <rect x="317" y="76" width="88" height="100" rx="11"/>
                  <rect x="438" y="76" width="88" height="100" rx="11"/>
                </g>
                <g fill="none" stroke="#8ff5f1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M107 93h20l8 8v25h-28z M127 93v8h8 M113 110h16 M113 118h12"/>
                  <path d="M220 102l20-10 20 10v24l-20 10-20-10z M220 102l20 10 20-10 M240 112v24"/>
                  <circle cx="361" cy="113" r="12"/><circle cx="361" cy="113" r="4"/><path d="M361 93v6 M361 127v6 M341 113h6 M375 113h6 M347 99l4 4 M371 123l4 4 M375 99l-4 4 M351 123l-4 4"/>
                  <path d="M457 129v-17h10v17 M474 129V98h10v31 M491 129v-24h10v24 M454 132h50"/>
                </g>
                <g font-size="11" fill="#b9e9f0" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" letter-spacing=".7">
                  <text x="119" y="158">OFFERTE</text><text x="240" y="158">ORDER</text>
                  <text x="361" y="158">PRODUCTIE</text><text x="482" y="158">MARGE</text>
                </g>
              </svg>
            </div>
            <div class="card-information"><div><small>02 / PRODUCTIE</small><h2>Productieflow</h2></div></div>
          </button>
          <button type="button" class="case-card case-news" data-case="news">
            <div class="card-illustration news-ill"><div class="news-pulse"><div class="news-item"><i aria-hidden="true"></i><div><b>Klanten</b><small>Nieuwe ontwikkelingen</small></div><strong>VOLGEN</strong></div><div class="news-item"><i aria-hidden="true"></i><div><b>Concurrenten</b><small>Activiteiten en veranderingen</small></div><strong>MONITOR</strong></div><div class="news-item"><i aria-hidden="true"></i><div><b>Markt</b><small>Trends en kansen</small></div><strong>SIGNALEN</strong></div></div></div>
            <div class="card-information"><div><small>03 / INTELLIGENCE</small><h2>Nieuws-AI</h2></div></div>
          </button>
          <button type="button" class="case-card case-cocanvas" data-case="cocanvas">
            <div class="card-illustration cocanvas-ill"><div class="schematic">
              <svg viewBox="0 0 560 245" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
                <rect x="82" y="20" width="396" height="208" rx="3" fill="#102536" stroke="#337d90" stroke-width="2"/>
                <g fill="none" stroke="#4ec3d4" stroke-width="2.2"><path d="M105 46H454V200H105ZM145 46V200M256 46V200M105 119H454M256 83H454M145 151H256"/></g>
                <g fill="none" stroke="#39869a" stroke-width="1" stroke-dasharray="4 4"><path d="M97 36H464M97 210H464M70 48V200M487 48V200"/></g>
                <g fill="#76f6ef"><circle cx="145" cy="119" r="4"/><circle cx="256" cy="83" r="4"/><circle cx="454" cy="119" r="4"/></g>
                <text x="389" y="65" fill="#7ad9e4" font-size="11">MODEL</text>
              </svg><span class="video-play">▶</span></div></div>
            <div class="card-information"><div><small>04 / ENGINEERING</small><h2>CoCanvas</h2></div></div>
          </button>
        </div>
      </section>
      <section id="detail-view" class="view is-hidden" aria-label="Geselecteerde toepassing">
        <div class="detail-toolbar"><button id="go-home" class="back-button" type="button">← Terug naar overzicht</button><span id="detail-kicker" class="detail-kicker"></span></div>
        <div class="detail-heading"><div><h1 id="detail-title"></h1><p id="detail-subtitle"></p></div><div class="detail-tag">ARCNODE / DEMO</div></div>
        <div id="detail-body"></div>
      </section>
    </main>
  </div>
</body>
</html>
